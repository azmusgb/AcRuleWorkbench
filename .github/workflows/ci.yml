name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  source-and-viewer-contract:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Viewer static tests
        run: npm test

      - name: Viewer lint
        run: npm run lint:viewer

      - name: Build source-clean package
        shell: pwsh
        run: .\scripts\package-source-clean.ps1

      - name: Validate source-clean package boundaries
        shell: pwsh
        run: .\scripts\validate-package-boundaries.ps1 -Root .\artifacts\source-clean -Mode SourcePackage
