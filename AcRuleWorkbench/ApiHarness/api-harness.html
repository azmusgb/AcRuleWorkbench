<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>AC Workbench API Console</title>
<link rel="stylesheet" href="api-harness.css">
</head>
<body>
<a class="skip-link" href="#consoleMain">Skip to console</a>
<div class="app">
<header class="top" role="banner">
  <div class="brand">
    <div class="logo" aria-hidden="true">AC</div>
    <div>
      <h1>API Console</h1>
      <span>Versioned /api/v1 product API - local developer console</span>
    </div>
  </div>
  <div class="top-tools" role="toolbar" aria-label="Console actions">
    <span class="pill" id="statusPill" role="status" aria-live="polite"><span class="dot warn"></span> Checking</span>
    <a class="btn" href="/viewer" target="_blank" rel="noreferrer">Open Workbench</a>
    <button class="btn" id="refreshHealth" type="button">Refresh health</button>
  </div>
</header>
<div class="layout">
<aside class="side" aria-label="API endpoints"><div class="head"><div class="eyebrow">Explorer</div><label class="caption" for="endpointSearch">Endpoint search</label><input class="search" id="endpointSearch" type="search" autocomplete="off" placeholder="status, scopes, rules..."></div><div class="list" id="endpointList" role="list"></div></aside>
<main class="main" id="consoleMain" tabindex="-1"><div class="content">
<section class="card request-card" aria-labelledby="endpointTitle"><div class="card-title-row"><div><div class="eyebrow">Request builder</div><h2 id="endpointTitle">Endpoint</h2><div class="caption" id="endpointDescription"></div></div><span class="method-large" id="methodBadge">GET</span></div><div class="row"><label for="baseUrl">Base URL</label><input id="baseUrl"></div><div class="grid"><div class="row"><label for="scopeId">scopeId</label><input id="scopeId" placeholder="AC/Pages/DentalADA"></div><div class="row"><label for="nodeId">nodeId</label><input id="nodeId" placeholder="123"></div><div class="row"><label for="query">q</label><input id="query" placeholder="provider"></div><div class="row"><label for="snapshotMode">snapshot mode</label><select id="snapshotMode"><option value="default">Default (server setting)</option><option value="snapshot">Snapshot cache</option><option value="live">Live rebuild</option></select></div><div class="row"><label for="extraQuery">extra query</label><input id="extraQuery" placeholder="limit=100&classification=FlatOnly"></div></div><div id="bodyBlock" class="is-hidden"><label class="caption" for="requestBody">Request body</label><textarea id="requestBody" rows="8"></textarea></div><div class="url" id="urlPreview"></div><div class="actions-row"><button class="btn primary" id="send" type="button">Send</button><button class="btn" id="copyUrl" type="button">Copy URL</button><button class="btn" id="copyCurl" type="button">Copy curl</button><button class="btn" id="copyResponse" type="button">Copy response</button><button class="btn" id="openSwagger" type="button">Open OpenAPI JSON</button></div></section>
<section class="summary" id="metrics"></section>
<section class="card response-card" aria-label="Response"><div class="tabs" role="tablist" aria-label="Response views"><button class="tab active" data-view="json" type="button">JSON</button><button class="tab" data-view="summary" type="button">Summary</button><button class="tab" data-view="headers" type="button">Headers</button><button class="tab" data-view="history" type="button">History</button></div><div id="result" class="result">Ready.</div></section>
</div></main></div></div><div class="toast" id="toast"></div>
<script>
(function(){'use strict';
const endpoints=[
{group:'Discovery',id:'status',method:'GET',path:'/api/v1/status',title:'Status',desc:'Server, API, snapshot, and workbench status.'},
{group:'Discovery',id:'capabilities',method:'GET',path:'/api/v1/capabilities',title:'Capabilities',desc:'Supported product API features.'},
{group:'Discovery',id:'routes',method:'GET',path:'/api/v1/routes',title:'Route catalog',desc:'Human-readable route catalog.'},
{group:'Discovery',id:'openapi',method:'GET',path:'/api/v1/openapi.json',title:'OpenAPI contract',desc:'Machine-readable OpenAPI 3 contract.'},
{group:'Health',id:'live',method:'GET',path:'/api/v1/health/live',title:'Liveness',desc:'Process is alive.'},
{group:'Health',id:'ready',method:'GET',path:'/api/v1/health/ready',title:'Readiness',desc:'Snapshot/API readiness.'},
{group:'Snapshot',id:'snapshot',method:'GET',path:'/api/v1/snapshot',title:'Snapshot',desc:'Current normalized snapshot metadata.'},
{group:'Snapshot',id:'refresh',method:'POST',path:'/api/v1/snapshot/refresh',title:'Refresh snapshot',desc:'Rebuild cached snapshot when enabled.'},
{group:'Scopes',id:'scopes',method:'GET',path:'/api/v1/scopes',title:'Scope list',desc:'All rule scopes with counts and health.'},
{group:'Scopes',id:'scope',method:'GET',path:'/api/v1/scopes/{scopeId}',title:'Scope detail',desc:'Deep scope summary.'},
{group:'Scopes',id:'structure',method:'GET',path:'/api/v1/scopes/{scopeId}/structure',title:'Scope structure',desc:'Structural hierarchy/order evidence.'},
{group:'Scopes',id:'inventory',method:'GET',path:'/api/v1/scopes/{scopeId}/inventory',title:'Scope inventory',desc:'Flat extraction rows with classification.'},
{group:'Scopes',id:'references',method:'GET',path:'/api/v1/scopes/{scopeId}/references',title:'Scope references',desc:'Static relationship evidence.'},
{group:'Scopes',id:'diagnostics',method:'GET',path:'/api/v1/scopes/{scopeId}/diagnostics',title:'Scope diagnostics',desc:'Extraction and interpretation diagnostics.'},
{group:'Rules',id:'rule',method:'GET',path:'/api/v1/rules/{nodeId}',title:'Rule detail',desc:'Evidence packet for a structural rule node.'},
{group:'Rules',id:'subtree',method:'GET',path:'/api/v1/rules/{nodeId}/subtree',title:'Rule subtree',desc:'Selected rule and descendants.'},
{group:'Search',id:'search',method:'GET',path:'/api/v1/search',title:'Search',desc:'Global evidence-aware search.',params:{q:'provider'}},
{group:'Diagnostics',id:'diagnosticsGlobal',method:'GET',path:'/api/v1/diagnostics',title:'Global diagnostics',desc:'API and snapshot diagnostics.'},
{group:'Export',id:'export',method:'POST',path:'/api/v1/export',title:'Export',desc:'Export an analytical slice.',body:{format:'json',scopeId:'AC/Pages/DentalADA',view:'structure',includeEvidence:true}}
];
const snapshotBackedEndpointIds=new Set(['snapshot','refresh','scopes','scope','structure','inventory','references','diagnostics','rule','subtree','search','diagnosticsGlobal','export']);
const initialSnapshotMode=((new URLSearchParams(location.search).get('snapshotMode')||'default').toLowerCase());
const $=id=>document.getElementById(id);let selected=endpoints[0],view='json',last={text:'Ready.',json:null,headers:'',status:'-',time:'-',size:'-'};function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function groupBy(arr,k){return arr.reduce((m,x)=>((m[x[k]]||(m[x[k]]=[])).push(x),m),{});}function renderEndpoints(){const q=$('endpointSearch').value.toLowerCase();const groups=groupBy(endpoints.filter(e=>!q||(e.title+' '+e.path+' '+e.desc+' '+e.group).toLowerCase().includes(q)),'group');$('endpointList').innerHTML=Object.keys(groups).map(g=>`<div class="group">${esc(g)}</div>`+groups[g].map(e=>`<button class="endpoint ${selected.id===e.id?'active':''}" data-id="${e.id}"><span class="method ${e.method==='POST'?'post':''}">${e.method}</span><b>${esc(e.title)}</b><span></span><span class="path">${esc(e.path)}</span></button>`).join('')).join('');}
function endpointSupportsSnapshotMode(endpoint){return snapshotBackedEndpointIds.has(endpoint.id);}
function select(id){selected=endpoints.find(e=>e.id===id)||selected;$('endpointTitle').textContent=selected.title;$('endpointDescription').textContent=selected.desc;$('methodBadge').textContent=selected.method;$('methodBadge').className='method-large '+(selected.method==='POST'?'post':'');$('query').value=selected.params?.q||'';$('bodyBlock').style.display=selected.method==='POST'?'block':'none';$('requestBody').value=selected.body?JSON.stringify(selected.body,null,2):'';const supportsSnapshotMode=endpointSupportsSnapshotMode(selected);$('snapshotMode').disabled=!supportsSnapshotMode;$('snapshotMode').title=supportsSnapshotMode?'Apply per-request snapshot behavior override.':'Not used by this endpoint.';renderEndpoints();updatePreview();}
// Applies a per-request override so GUI users can switch live rebuild vs cached snapshot behavior.
function buildUrl(){let path=selected.path.replace('{scopeId}',encodeURIComponent($('scopeId').value.trim()||'AC/Pages/DentalADA')).replace('{nodeId}',encodeURIComponent($('nodeId').value.trim()||'1'));const url=new URL(path,$('baseUrl').value.trim()||location.origin);const q=$('query').value.trim();if(q)url.searchParams.set('q',q);if(endpointSupportsSnapshotMode(selected)){const snapshotMode=$('snapshotMode').value;if(snapshotMode==='live'||snapshotMode==='snapshot')url.searchParams.set('snapshotMode',snapshotMode);}const extra=$('extraQuery').value.trim().replace(/^\?/,'');if(extra)new URLSearchParams(extra).forEach((v,k)=>url.searchParams.set(k,v));return url;}
function updatePreview(){$('urlPreview').textContent=`${selected.method} ${buildUrl()}`;}function renderMetrics(){const items=[['Status',last.status],['Time',last.time],['Size',last.size],['Endpoint',selected.title],['Method',selected.method]];$('metrics').innerHTML=items.map(i=>`<div class="metric"><b>${esc(i[1])}</b><span>${esc(i[0])}</span></div>`).join('');}
function renderResult(){document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===view));const r=$('result');if(view==='json'){r.className='result';r.textContent=last.text;return;}if(view==='headers'){r.className='result';r.textContent=last.headers||'No headers captured.';return;}if(view==='history'){r.className='result';r.innerHTML=history().map((h,i)=>`<div class="history-item"><b>${esc(h.status)} - ${esc(h.ms)} ms</b><br><span class="caption">${esc(h.method)} ${esc(h.url)}</span></div>`).join('')||'No history.';return;}r.className='result';r.innerHTML=summary(last.json);}function summary(j){if(!j)return 'No parsed JSON.';const data=j.data??j;const keys=Object.keys(data||{});return `ok: ${esc(j.ok)}\nschema: ${esc(j.schema||'(none)')}\nsnapshotId: ${esc(j.snapshotId||'(none)')}\nkeys: ${esc(keys.join(', ')||'(none)')}`;}
async function send(){const url=buildUrl(),start=performance.now();last={text:'Loading...',json:null,headers:'',status:'...',time:'-',size:'-'};renderMetrics();renderResult();try{const options={method:selected.method,cache:'no-store',headers:{'Accept':'application/json'}};if(selected.method==='POST'){options.headers['Content-Type']='application/json';options.body=$('requestBody').value.trim()||'{}';}const res=await fetch(url,options);const text=await res.text();let json=null,pretty=text;try{json=JSON.parse(text);pretty=JSON.stringify(json,null,2);}catch{}last={text:`HTTP ${res.status} ${res.statusText}\n${selected.method} ${url}\n\n${pretty}`,json,headers:[...res.headers.entries()].map(([k,v])=>`${k}: ${v}`).join('\n'),status:String(res.status),time:String(Math.round(performance.now()-start))+' ms',size:formatBytes(text.length)};pushHistory({method:selected.method,url:String(url),status:res.status,ms:Math.round(performance.now()-start)});}catch(e){last={text:'REQUEST FAILED\n'+(e.stack||e.message||String(e)),json:null,headers:'',status:'ERR',time:'-',size:'-'};}renderMetrics();renderResult();}
function formatBytes(n){return n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB';}function history(){try{return JSON.parse(localStorage.getItem('acApiHistory')||'[]')}catch{return[]}}function pushHistory(x){const h=history();h.unshift({...x,at:new Date().toISOString()});localStorage.setItem('acApiHistory',JSON.stringify(h.slice(0,25)));}function copy(t){navigator.clipboard?.writeText(t).then(()=>toast('Copied')).catch(()=>toast('Clipboard unavailable'));}function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1400);}async function health(){try{const res=await fetch(new URL('/api/v1/health/ready',location.origin),{cache:'no-store'});$('statusPill').innerHTML=`<span class="dot ${res.ok?'':'err'}"></span>${res.ok?'Ready':'Not ready'}`;}catch{$('statusPill').innerHTML='<span class="dot err"></span>Offline';}}
$('endpointList').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b)select(b.dataset.id);});$('endpointSearch').addEventListener('input',renderEndpoints);['baseUrl','scopeId','nodeId','query','snapshotMode','extraQuery','requestBody'].forEach(id=>$(id).addEventListener('input',updatePreview));$('send').onclick=send;$('copyUrl').onclick=()=>copy(String(buildUrl()));$('copyCurl').onclick=()=>copy(`${selected.method==='POST'?'curl -s -X POST -H "Content-Type: application/json" --data '+JSON.stringify($('requestBody').value.trim()||'{}')+' ':'curl -s '}`+JSON.stringify(String(buildUrl())));$('copyResponse').onclick=()=>copy(last.text);$('openSwagger').onclick=()=>window.open('/api/v1/openapi.json','_blank');$('refreshHealth').onclick=health;document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{view=t.dataset.view;renderResult();});document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();send();}});$('baseUrl').value=location.origin;if(initialSnapshotMode==='live'||initialSnapshotMode==='snapshot')$('snapshotMode').value=initialSnapshotMode;renderEndpoints();select('status');renderMetrics();renderResult();health();
})();
</script>
</body>
</html>
